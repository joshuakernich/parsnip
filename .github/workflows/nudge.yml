name: Daily Parsnip nudge

# Runs every 30 minutes. When a run lands within 35 minutes before PARSNIP_TIME
# (in PARSNIP_TZ), it waits for the exact minute and sends a Web Push to the
# Parsnip app. A dated cache entry makes sure only one nudge goes out per day.
on:
  schedule:
    - cron: '4,34 * * * *'
  workflow_dispatch:
    inputs:
      send_now:
        description: Send a test notification right now
        type: boolean
        default: true

concurrency:
  group: nudge
  cancel-in-progress: false

permissions:
  actions: write # cache entries + keeping the schedule from being auto-disabled

env:
  PARSNIP_TIME: ${{ vars.PARSNIP_TIME || '20:00' }}
  PARSNIP_TZ: ${{ vars.PARSNIP_TZ || 'Australia/Melbourne' }}
  SEND_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.send_now }}

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Is it nudge time?
        id: plan
        run: node .github/scripts/nudge.mjs plan >> "$GITHUB_OUTPUT"

      - name: Already sent today?
        id: sent
        if: steps.plan.outputs.act == 'true' && env.SEND_NOW != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .nudge-sent
          key: nudge-sent-${{ steps.plan.outputs.date }}
          lookup-only: true

      - name: Send nudge
        id: send
        if: steps.plan.outputs.act == 'true' && steps.sent.outputs.cache-hit != 'true'
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          WAIT_SECONDS: ${{ steps.plan.outputs.wait }}
        run: |
          npm install --no-save --no-audit --no-fund web-push@3.6.7 >/dev/null
          node .github/scripts/nudge.mjs send
          mkdir -p .nudge-sent && date > .nudge-sent/stamp

      - name: Remember today's nudge
        if: steps.send.outcome == 'success' && env.SEND_NOW != 'true'
        uses: actions/cache/save@v4
        with:
          path: .nudge-sent
          key: nudge-sent-${{ steps.plan.outputs.date }}

      - name: Keep schedule alive
        # Scheduled workflows in quiet repos are disabled after 60 days; re-enabling resets that clock.
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Once a day is plenty: only the first run after midnight UTC
          [ "$(date -u +%H)" = "00" ] && [ "$(date -u +%M)" -lt 30 ] || exit 0
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nudge.yml/enable"
