name: Daily Parsnip nudge

# Runs twice an hour; the script only sends when it's close to PARSNIP_TIME in
# PARSNIP_TZ, and only once per day. GitHub's schedule can lag, so the script
# hands ntfy the exact delivery time instead of relying on when the job starts.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      send_now:
        description: Send a test notification right now
        type: boolean
        default: true

permissions:
  actions: write # lets the job keep its own schedule from being auto-disabled

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send nudge
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          PARSNIP_TIME: ${{ vars.PARSNIP_TIME || '20:00' }}
          PARSNIP_TZ: ${{ vars.PARSNIP_TZ || 'Australia/Melbourne' }}
          APP_URL: ${{ vars.APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          SEND_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.send_now }}
        run: python3 .github/scripts/nudge.py
      - name: Keep schedule alive
        # Scheduled workflows in quiet repos are disabled after 60 days; re-enabling resets that clock.
        if: github.event_name == 'schedule' && github.run_number % 48 == 0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nudge.yml/enable"
